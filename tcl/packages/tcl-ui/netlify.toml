# Login requires browser Supabase config baked at BUILD time (postbuild inlines into dist/index.html).
# In Netlify → Site configuration → Environment variables, add (any ONE naming style is fine):
#   SUPABASE_URL + SUPABASE_ANON_KEY
#   OR NEXT_PUBLIC_SUPABASE_URL + NEXT_PUBLIC_SUPABASE_ANON_KEY
# Scope must include this site's builds (Production + Deploy previews if you use them). "Runtime only" / Functions-only scopes will NOT inject into the Angular bundle.
# After deploy, open DevTools → Elements → first <script> in <head> should show your project URL (not "").

[build]
  # lockfileVersion 3 needs npm 9+ (Node 18+). Netlify's default Node can be older and makes `npm ci` fail with EUSAGE.
  # Pin NODE_VERSION below, then prefer `npm ci`; if it still fails, fall back to `npm install`.
  command = "( npm ci || npm install --no-audit --no-fund ) && npm run build -- --configuration production"
  publish = "dist/tcl-ui/browser"
  timeout = 300

[build.environment]
  NODE_VERSION = "20"

# Force HTTPS - redirect all HTTP traffic to HTTPS
[[redirects]]
  from = "http://protectqa.com/*"
  to = "https://protectqa.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.protectqa.com/*"
  to = "https://www.protectqa.com/:splat"
  status = 301
  force = true

# Redirect API calls to the TCL Core service via proxy function
# You'll need to set NETLIFY_TCL_CORE_URL environment variable in Netlify dashboard
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/proxy?path=:splat"
  status = 200
  force = true

# SPA fallback - all routes should serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

