<div class="app-container">
  <app-header 
    pageTitle="Call Center QA" 
    pageSubtitle="Compliance & Risk Analysis for Call Transcripts"
    [showNavigation]="true">
    <div headerActions>
      <button
        *ngIf="result"
        mat-icon-button
        matTooltip="Export to CSV"
        (click)="exportToCSV()"
        color="primary"
      >
        <mat-icon>table_chart</mat-icon>
      </button>
      <button
        *ngIf="result"
        mat-icon-button
        matTooltip="Export to PDF"
        (click)="exportToPDF()"
        color="primary"
      >
        <mat-icon>picture_as_pdf</mat-icon>
      </button>
      <button
        *ngIf="result"
        mat-icon-button
        matTooltip="Download Report JSON"
        (click)="downloadReport()"
        color="primary"
      >
        <mat-icon>download</mat-icon>
      </button>
    </div>
  </app-header>

  <div class="main-layout">
    <div class="left-column">
      <app-input-panel
        (validate)="onValidate($event)"
        [loading]="loading"
        [initialQuestion]="currentQuestion"
        [initialAnswer]="currentAnswer"
        [initialSources]="currentSources"
        [initialCallMetadata]="currentCallMetadata"
        [initialOptions]="currentOptions"
      ></app-input-panel>

      <app-summary-panel
        [result]="result"
        [loading]="loading"
      ></app-summary-panel>
    </div>

    <div class="right-column">
      <app-claim-table
        [claims]="claimsWithMetadata"
        [loading]="loading"
      ></app-claim-table>

      <app-graph-view
        [claims]="claimsWithMetadata"
        [edges]="graphEdges"
        [loading]="loading"
      ></app-graph-view>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-left"></div>
    <div class="footer-right">
      <span class="version-info" *ngIf="engineVersion">
        Engine: {{ engineVersion }}
      </span>
      <span class="metrics-info" *ngIf="latency !== null || cacheHitRate !== null">
        <span *ngIf="latency !== null">Latency: {{ latency }}ms</span>
        <span *ngIf="cacheHitRate !== null"> | Cache: {{ cacheHitRate }}%</span>
      </span>
    </div>
  </footer>
</div>
