<div class="app-container">
  <header class="app-header">
    <div class="header-content">
      <div class="header-left">
        <app-logo></app-logo>
      </div>
      <div class="header-title">
        <h1>Call Center QA</h1>
        <p class="subtitle">Compliance & Risk Analysis for Call Transcripts</p>
      </div>
      <div class="header-actions">
        <a mat-button routerLink="/original-qa" routerLinkActive="active">
          <mat-icon>swap_horiz</mat-icon>
          Switch to Original QA
        </a>
        <button *ngIf="!isAuthenticated" mat-button routerLink="/login">
          <mat-icon>login</mat-icon>
          Sign In
        </button>
        <button *ngIf="isAuthenticated" mat-icon-button [matMenuTriggerFor]="userMenu">
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <div class="user-menu-header">
            <div class="user-email">{{ currentUser?.email }}</div>
            <div class="user-role" *ngIf="currentUser?.companyRole">{{ currentUser?.companyRole }}</div>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item routerLink="/onboarding">
            <mat-icon>settings</mat-icon>
            <span>Profile Settings</span>
          </button>
          <button mat-menu-item (click)="signOut()">
            <mat-icon>logout</mat-icon>
            <span>Sign Out</span>
          </button>
        </mat-menu>
        <button
          *ngIf="result"
          mat-icon-button
          matTooltip="Export to CSV"
          (click)="exportToCSV()"
          color="primary"
        >
          <mat-icon>table_chart</mat-icon>
        </button>
        <button
          *ngIf="result"
          mat-icon-button
          matTooltip="Export to PDF"
          (click)="exportToPDF()"
          color="primary"
        >
          <mat-icon>picture_as_pdf</mat-icon>
        </button>
        <button
          *ngIf="result"
          mat-icon-button
          matTooltip="Download Report JSON"
          (click)="downloadReport()"
          color="primary"
        >
          <mat-icon>download</mat-icon>
        </button>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <div class="left-column">
      <app-input-panel
        (validate)="onValidate($event)"
        [loading]="loading"
        [initialQuestion]="currentQuestion"
        [initialAnswer]="currentAnswer"
        [initialSources]="currentSources"
        [initialCallMetadata]="currentCallMetadata"
        [initialOptions]="currentOptions"
      ></app-input-panel>

      <app-summary-panel
        [result]="result"
        [loading]="loading"
      ></app-summary-panel>
    </div>

    <div class="right-column">
      <app-claim-table
        [claims]="claimsWithMetadata"
        [loading]="loading"
      ></app-claim-table>

      <app-graph-view
        [claims]="claimsWithMetadata"
        [edges]="graphEdges"
        [loading]="loading"
      ></app-graph-view>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-left"></div>
    <div class="footer-right">
      <span class="version-info" *ngIf="engineVersion">
        Engine: {{ engineVersion }}
      </span>
      <span class="metrics-info" *ngIf="latency !== null || cacheHitRate !== null">
        <span *ngIf="latency !== null">Latency: {{ latency }}ms</span>
        <span *ngIf="cacheHitRate !== null"> | Cache: {{ cacheHitRate }}%</span>
      </span>
    </div>
  </footer>
</div>
