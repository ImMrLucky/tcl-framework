<header>
  <div class="container">
    <div class="header-content">
      <div class="header-left">
        <app-logo></app-logo>
        <div *ngIf="pageTitle" class="page-title-section">
          <h1 class="page-title">{{ pageTitle }}</h1>
          <p *ngIf="pageSubtitle" class="page-subtitle">{{ pageSubtitle }}</p>
        </div>
      </div>
      
      <div class="header-actions">
        <!-- Back button (optional) -->
        <button *ngIf="showBackButton" mat-button [routerLink]="backButtonRoute">
          <mat-icon>arrow_back</mat-icon>
          {{ backButtonText }}
        </button>

        <!-- Navigation buttons (optional) -->
        <ng-container *ngIf="showNavigation && isAuthenticated">
          <button mat-button routerLink="/dashboard" routerLinkActive="active">
            <mat-icon>dashboard</mat-icon>
            Dashboard
          </button>
          <button mat-button routerLink="/call-center-qa" routerLinkActive="active">
            <mat-icon>phone</mat-icon>
            Call Center QA
          </button>
          <button mat-button routerLink="/original-qa" routerLinkActive="active">
            <mat-icon>description</mat-icon>
            Original QA
          </button>
        </ng-container>

        <!-- Page-specific actions (projected content) -->
        <ng-content select="[headerActions]"></ng-content>

        <!-- User menu (only when authenticated) -->
        <ng-container *ngIf="isAuthenticated">
          <button mat-icon-button [matMenuTriggerFor]="userMenu">
            <mat-icon>account_circle</mat-icon>
          </button>
          <mat-menu #userMenu="matMenu">
            <div class="user-menu-header">
              <div class="user-email">{{ currentUser?.email }}</div>
              <div class="user-role" *ngIf="currentUser?.companyRole">{{ currentUser?.companyRole }}</div>
            </div>
            <mat-divider></mat-divider>
            <button mat-menu-item routerLink="/dashboard">
              <mat-icon>dashboard</mat-icon>
              <span>Dashboard</span>
            </button>
            <button mat-menu-item routerLink="/profile">
              <mat-icon>settings</mat-icon>
              <span>Profile Settings</span>
            </button>
            <button mat-menu-item (click)="signOut()">
              <mat-icon>logout</mat-icon>
              <span>Sign Out</span>
            </button>
          </mat-menu>
        </ng-container>
      </div>
    </div>
  </div>
</header>
