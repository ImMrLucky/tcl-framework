<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TCL Framework Demo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Allow setting API URL via environment variable or Netlify build-time injection
    if (typeof window !== 'undefined') {
      // Default to proxy path for Netlify (quick API calls like /auth, /conversations)
      if (!window.__TCL_API_URL) {
        window.__TCL_API_URL = null; // null means use relative /api path
      }
      // Railway URL for long-running operations like /validate (bypasses Netlify timeout)
      // This is the tcl-core Railway service URL
      if (!window.__TCL_EVALUATION_URL) {
        window.__TCL_EVALUATION_URL = 'https://tcl-framework-production.up.railway.app';
      }
      // Public Supabase client (anon key only). Set your project values for local auth — never put SUPABASE_SERVICE_ROLE_KEY in the browser.
      // window.__SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
      // window.__SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
